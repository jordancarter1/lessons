<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <title>Input Menu</title>
</head>
<body>
    
    <div class="container">

        <div class="right-side">
            <div class="image">
                <img class="img-right" src="img/image.png" alt="">
            </div>
        </div>
       


        <main>
            <h1>Create an account</h1>

            <div class="buttons">
                <button type="button"><img src="/img/Frame.png" alt="">Sign in with google</button>
                <button type="button"><img src="/img/Frame (1).png" alt="">Sign in with twitter</button>
                <p>OR</p>
            </div>

            <div class="register">
                <div class="string-1">
                    <label for="email"><h2>email</h2></label>
                        <input class="main" type="email" placeholder=" Enter your email">
                </div>
                <div class="string-2">
                    <label for="email"><h2>password</h2></label>
                        <input class="main" type="password" placeholder="Create a password">
                </div>
            </div>

            <div class="terms">
                <form action="get">
                    <input class="inp" type="checkbox" name="" id="">
                    <h2 class="conditions">I agree with <a href="#">Terms and conditions</a></h2>
                </form>
                <button class="account" onclick="">Create an account</button>

                <div class="login">
                    <p class="log">Already have ann account?<a class="in" href="$">log in</a></p>
                </div>
            </div>
                     
    
        </main>

        
    </div>

</body>
</html>
